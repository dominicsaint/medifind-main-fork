# MediFind platform backend configuration.
# Supply real Supabase credentials through environment variables, or override
# the defaults below. Enable the PostGIS extension in Supabase
# (Database > Extensions) before the first run; the V1 migration uses the
# extensions schema for geography types.

spring:
  application:
    name: medifind-platform

  datasource:
    # Supabase direct connection. Set DB_PASSWORD in the environment; never
    # commit the real password. sslmode=require is the Supabase default.
    url: ${DB_URL:jdbc:postgresql://db.nkoqnmecepefwgyfbfom.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # Flyway owns the schema; JPA only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
